name: CI

# Every pushed branch gets a run, because feature branches are often pushed
# without a pull request and workflow_dispatch only works once this file is on
# the default branch. Pull requests from forks are covered by pull_request.
# A branch with an open pull request runs twice; the repo is public, so the
# extra minutes are free.
on:
  push:
  pull_request:
  workflow_dispatch:

# One run per branch or pull request at a time. A new push cancels the stale
# run, except on main, where every commit gets a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Envelopes only in content/sealed/, no plaintext workspace, cache or key
      # tracked, no key text in any file, and the QZ_CONTENT_KEY secret only
      # where decisions memo §17 allows it (CNT-0, ARCHITECTURE §5.4 and
      # §5.7). It needs only Node and git, so it runs first: a failing step
      # further down can never skip it.
      - name: Secret scan
        run: npm run check:secrets

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Schemas and lint over content/ and its fixtures (CNT-1, ARCHITECTURE
      # §5.7). Sealed content is not decrypted here: its messages never quote
      # item text, but the key is only for the content-sealed job.
      - name: Content check
        run: npm run content:check

      # Same command Vercel runs, with the default (real) backend config.
      - name: Build
        run: npm run build

      # Gzipped first-load JS per route, from the build above.
      - name: Bundle budget
        run: npm run check:bundle

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Builds and starts the app with the mock backend (see playwright.config.ts).
      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true
