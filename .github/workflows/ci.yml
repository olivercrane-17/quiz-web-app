name: CI

# Every pushed branch gets a run, because feature branches are often pushed
# without a pull request and workflow_dispatch only works once this file is on
# the default branch. Pull requests from forks are covered by pull_request.
# A branch with an open pull request runs twice; the repo is public, so the
# extra minutes are free.
on:
  push:
  pull_request:
  workflow_dispatch:

# One run per branch or pull request at a time. A new push cancels the stale
# run, except on main, where every commit gets a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # Vitest's unit, engine and bench projects; the static import checks of
      # ARCHITECTURE §11.2 run inside them.
      - name: Unit tests
        run: npm test

      # src/engine keeps 95% line and 90% branch coverage (ARCHITECTURE §4.1).
      - name: Engine coverage
        run: npm run test:coverage

      # Schemas and lint over content/ and its fixtures (CNT-1, ARCHITECTURE
      # §5.7). Sealed content is not decrypted here: its messages never quote
      # item text, but the key is only for the content-sealed job.
      - name: Content check
        run: npm run content:check

      # Envelopes only in content/sealed/, and no plaintext workspace, cache or
      # key tracked (SQL-3, ARCHITECTURE §5.4).
      - name: Secret scan
        run: npm run check:secrets

      # Same command Vercel runs, with the default (real) backend config.
      - name: Build
        run: npm run build

      # Gzipped first-load JS per route, from the build above.
      - name: Bundle budget
        run: npm run check:bundle

  # The browser matrix of ARCHITECTURE §11.8, one browser per leg. Every leg
  # runs on every push: the release criteria need CI green in Chromium,
  # WebKit and Firefox (decisions memo §13).
  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One browser failing never hides another's result.
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            projects: --project=desktop-chromium --project=mobile-chromium --project=pwa-chromium
          - browser: webkit
            projects: --project=mobile-webkit
          - browser: firefox
            projects: --project=desktop-firefox
    env:
      # Puts the WebKit and Firefox projects in playwright.config.ts's list.
      E2E_ALL_BROWSERS: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # Builds and starts the app with the mock backend (see playwright.config.ts).
      - name: Run E2E tests
        run: npm run test:e2e -- ${{ matrix.projects }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true
