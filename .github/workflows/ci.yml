name: CI

# Every pushed branch gets a run, because feature branches are often pushed
# without a pull request and workflow_dispatch only works once this file is on
# the default branch. Pull requests from forks are covered by pull_request.
# A branch with an open pull request runs twice; the repo is public, so the
# extra minutes are free.
on:
  push:
  pull_request:
  workflow_dispatch:

# One run per branch or pull request at a time. A new push cancels the stale
# run, except on main, where every commit gets a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: the content check compares each answer list's liveAt
      # with the commit that first published its version (ARCHITECTURE §5.2,
      # §5.7), which a shallow clone can't show.
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Envelopes only in content/sealed/, no plaintext workspace, cache or key
      # tracked, no key text in any file, and the QZ_CONTENT_KEY secret only
      # where decisions memo §17 allows it (CNT-0, ARCHITECTURE §5.4 and
      # §5.7). It needs only Node and git, so it runs first: a failing step
      # further down can never skip it.
      - name: Secret scan
        run: npm run check:secrets

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # Vitest's unit, engine and bench projects; the static import checks of
      # ARCHITECTURE §11.2 run inside them.
      - name: Unit tests
        run: npm test

      # src/engine keeps 95% line and 90% branch coverage (ARCHITECTURE §4.1).
      - name: Engine coverage
        run: npm run test:coverage

      # Schemas, lint and the cross-file rules over content/ and its fixtures,
      # the lists' liveAt against git history, the pack and list size budgets,
      # and the drift check: every content:build output rebuilt in memory and
      # compared with what is committed (CNT-1, ARCHITECTURE §5.2, §5.3,
      # §5.7). Sealed content is not decrypted here: the key is only for the
      # content-sealed job.
      - name: Content check
        run: npm run content:check

      # The cross-pool check (X29) over the fixture world, whose Mysteries
      # and Encores count as Daily items here: every mock build plays the
      # fixture practice packs beside the fixture Dailies, so no practice
      # item may state a fixture Daily's fact (CONTENT_GUIDE §10.5; RITE
      # round 2, R2-22). Plaintext fixtures only: no key, nothing sealed.
      - name: Fixture cross-pool check
        run: npm run content:dedupe -- --cross-pool --fixtures --root content/fixtures

      # Same command Vercel runs, with the default (real) backend config.
      - name: Build
        run: npm run build

      # Gzipped first-load JS per route, from the build above: 150 kB on /,
      # 180 kB on the play routes, 200 kB elsewhere (ARCHITECTURE §10.9).
      - name: Bundle budget
        run: npm run check:bundle

      # From the same build: no lazy-only module (a __qz_lazy_ marker, the
      # Supabase SDK) in any route's first load, and no sealed id under
      # .next/static, .next/server/app or public/ (ARCHITECTURE §5.4, §10.9;
      # AC-CNT-07). Sealed text needs the content key, which only the
      # content-sealed job may hold, so this step scans for ids alone; that
      # job scans a build of its own for the text (ARCHITECTURE §5.4, §5.7).
      - name: Lazy markers and sealed scan
        run: npm run check:lazy

  # The sealed content check (SQL-3, ARCHITECTURE §5.7): content/sealed/
  # decrypted in memory; the sealed items, the schedule, the spare sets and
  # the latest audit record validated; and the cross-pool dedupe (X29,
  # AC-CNT-06). Every line goes through the redacting reporter of §5.4, so
  # these public logs show ids, rule codes and counts, never content. Only
  # two steps receive the key, a repository secret (decisions memo §17):
  # this check and the sealed text scan below, each running one in-memory
  # command that secret-scan.mjs allows. Without it the same command prints
  # "Sealed content validation: not run" and checks the plaintext content
  # alone. Pull requests from forks never receive secrets, so they skip
  # both steps.
  #
  # Then the sealed half of AC-CNT-07's bundle scan (§5.4). The verify job's
  # check:lazy looks for sealed ids alone, since the key stays out of that
  # job. Here the app is built with the default config, as Vercel and the
  # verify job build it, in a step that never sees the key, and only then
  # does `check:lazy -- --sealed` decrypt content/sealed/ in memory and scan
  # every file a browser or crawler can fetch (.next/static,
  # .next/server/app, public/) for any sealed clue, stem, question,
  # explanation or claim, and any answer (Encore number, Mystery key by
  # entity id, name or alias, room answer) beside its item's text. It prints
  # counts and, per finding, the file, the item id and the field, never
  # text (§5.4's output rule), and fails on a hit. Both key steps also run
  # when the other fails: a content finding never hides a leak, nor the
  # reverse.
  content-sealed:
    name: Sealed content check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Full history: the content check compares each answer list's liveAt
      # with the commit that first published its version (§5.2).
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Sealed content check and cross-pool dedupe
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          QZ_CONTENT_KEY: ${{ secrets.QZ_CONTENT_KEY }}
        run: npm run content:check -- --sealed

      # Whether the secret is set, which says nothing else about it. Forks,
      # and pull requests from them, get no secrets: they skip the build and
      # the scan, whose --sealed refuses to run without the key.
      - name: Check whether the content key is set
        id: key
        if: "!cancelled()"
        run: echo "present=${{ secrets.QZ_CONTENT_KEY != '' }}" >> "$GITHUB_OUTPUT"

      # Without the key, so nothing sealed can reach the build or its log.
      - name: Build for the sealed text scan
        id: build
        if: "!cancelled() && steps.install.outcome == 'success' && steps.key.outputs.present == 'true'"
        timeout-minutes: 10
        run: npm run build

      - name: Sealed text scan of the build
        if: "!cancelled() && steps.build.outcome == 'success'"
        timeout-minutes: 5
        env:
          QZ_CONTENT_KEY: ${{ secrets.QZ_CONTENT_KEY }}
        run: npm run check:lazy -- --sealed

  # The browser matrix of ARCHITECTURE §11.8, one browser per leg. Every leg
  # runs on every push: the release criteria need CI green in Chromium,
  # WebKit and Firefox (decisions memo §13).
  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # A retried browser install (up to 18 minutes) plus a full run (16 on
    # the Chromium leg in run 42036434893).
    timeout-minutes: 40
    strategy:
      # One browser failing never hides another's result.
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            projects: --project=desktop-chromium --project=mobile-chromium --project=pwa-chromium
          - browser: webkit
            projects: --project=mobile-webkit
          - browser: firefox
            projects: --project=desktop-firefox
    env:
      # Puts the WebKit and Firefox projects in playwright.config.ts's list.
      E2E_ALL_BROWSERS: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The browser build lives in ~/.cache/ms-playwright, cached per
      # Playwright version, browser and runner image (Playwright downloads a
      # build per Ubuntu release). The system packages it needs can't be
      # cached that way, so they install on every run, from apt.
      - name: Read the Playwright version
        id: playwright
        run: |
          version=$(node -p 'require("@playwright/test/package.json").version')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright ${{ matrix.browser }}
        id: browser-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}

      # An apt mirror once stalled this step past its limit (CI run
      # 42036434893, Firefox). apt now gives up on a stalled download after
      # 60 s and retries it, and the whole install gets a second attempt,
      # each attempt capped at 8 minutes (timeout stops the attempt's whole
      # process group, and dpkg finishes what it was doing before the
      # retry), so one bad mirror can't fail the leg. On a cache hit only
      # the system packages install.
      - name: Install Playwright ${{ matrix.browser }}
        timeout-minutes: 18
        env:
          BROWSER: ${{ matrix.browser }}
          CACHE_HIT: ${{ steps.browser-cache.outputs.cache-hit }}
        run: |
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "60";\nAcquire::https::Timeout "60";\n' |
            sudo tee /etc/apt/apt.conf.d/80-ci-retries > /dev/null
          if [ "$CACHE_HIT" = "true" ]; then
            install=(npx playwright install-deps "$BROWSER")
          else
            install=(npx playwright install --with-deps "$BROWSER")
          fi
          for attempt in 1 2; do
            if timeout --kill-after=30s 8m "${install[@]}"; then
              exit 0
            fi
            echo "::warning::Installing Playwright $BROWSER failed on attempt $attempt."
            sudo dpkg --configure -a || true
            sleep 15
          done
          exit 1

      # Saved as soon as the browser is in, so a failing E2E run still
      # leaves the cache for the next one.
      - name: Save Playwright ${{ matrix.browser }}
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}

      # Builds and starts the app with the mock backend (see playwright.config.ts).
      - name: Run E2E tests
        run: npm run test:e2e -- ${{ matrix.projects }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true
